name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The built-in token is all that is needed — no personal access token, no
# secrets (ADR-0005).
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two pushes race a deploy; the newer one wins, but an in-flight
# deploy is allowed to finish rather than being cancelled mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc -b

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
